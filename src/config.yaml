# ============================================
# LEGACY CONFIG - kept for compatibility
# Primary config is now: src/content/settings/site.json
# Edit site.json to update branding globally
# ============================================

site:
  name: Alamo Media Network
  site: "https://alamomedianetwork.com"
  base: "/"
  trailingSlash: false

# Default SEO metadata
metadata:
  title:
    default: Alamo Media Network
    template: "%s | Alamo Media Network"
  description: "Expand your reach with San Antonio's largest indoor digital billboards. Alamo Media Network connects local businesses with more customers."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Alamo Media Network
    images:
      - url: "~/assets/images/default.png"
        width: 1200
        height: 628
    type: website
  twitter:
    handle: ""
    site: ""
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

ui:
  theme: "system"
